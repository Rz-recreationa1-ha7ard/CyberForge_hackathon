project_name: "CyberForge Autonomous PTES Engine"
tier: "recon"

scope:
  allowed_cidrs:
    - "127.0.0.1/32"
    - "192.168.1.0/24"
  allowed_ports: null
  max_scan_timeout_seconds: 1200

reporting:
  api_host: "0.0.0.0"
  api_port: 8000
  export_dir: "./reports"
  auto_generate_on_finish: true

agents:
  - name: "network_discovery"
    role: "Network and Port Enumerator"
    surface: "network"
    enabled: true
    triggers:
      - "startup"
    parameters:
      scan_speed: "fast"
      top_ports: 100

  - name: "web_agent"
    role: "Web Application Surface Analyzer"
    surface: "web"
    enabled: true
    triggers:
      - "service:http"
      - "service:https"
    parameters:
      max_crawl_depth: 2
      user_agent: "CyberForge-Auditor/1.0"

  - name: "binary_agent"
    role: "Static Binary Analyzer"
    surface: "binary"
    enabled: true
    triggers:
      - "asset:binary"
    parameters:
      inspect_strings: true
      unsafe_functions:
        - "strcpy"
        - "gets"
        - "system"

  - name: "verification_agent"
    role: "Finding Verification Engine"
    surface: "network"
    enabled: true
    triggers:
      - "finding:unverified"
    parameters:
      retry_count: 2

